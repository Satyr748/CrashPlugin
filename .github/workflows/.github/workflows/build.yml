
name: Build Minecraft Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 21 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Plugin bauen
        uses: gradle/actions/setup-gradle@v4

      - name: JAR erstellen
        run: gradle build

      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CrashPlugin
          path: build/libs/*.jar
